<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black circle -->
  <circle cx="50" cy="52" r="46" fill="#111111"/>

  <!-- Figure: head -->
  <circle cx="55" cy="36" r="5.5" fill="white"/>

  <!-- Figure: body (tapered torso) -->
  <path d="M52 41 L48 68 L62 68 L58 41 Z" fill="white"/>

  <!-- Figure: left arm sweeping down-left -->
  <path d="M52 47 Q38 48 22 58" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Figure: right arm sweeping down-right -->
  <path d="M58 47 Q68 48 80 56" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Ground/hill the figure stands on (white arc at bottom) -->
  <path d="M20 74 Q50 62 82 74" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 8-point star top right -->
  <g transform="translate(74,26)">
    <!-- Long cardinal rays -->
    <line x1="0" y1="-10" x2="0" y2="10"  stroke="white" stroke-width="2"   stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0"  stroke="white" stroke-width="2"   stroke-linecap="round"/>
    <!-- Short diagonal rays -->
    <line x1="-7" y1="-7" x2="7" y2="7"   stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="7" y1="-7"  x2="-7" y2="7"  stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
